name: Profile snake

on:
  workflow_dispatch:
  schedule:
    - cron: '18 3 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - README.md

concurrency:
  group: profile-snake
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    if: github.repository == 'samkrull/samkrull'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create header and unified statistics panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import argparse
          import base64
          import datetime
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          
          
          NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", NS)
          
          
          def tag(name):
              return "{" + NS + "}" + name
          
          
          def source_urls():
              common = {
                  "username": "samkrull", "theme": "github_dark", "locale": "pt-br",
                  "bg_color": "0D1117", "title_color": "79C0FF", "text_color": "C9D1D9",
                  "icon_color": "79C0FF", "hide_border": "true", "border_radius": "0",
                  "disable_animations": "true", "card_width": "495",
              }
              stats = dict(common, show_icons="true", hide_rank="true", custom_title="GitHub em números")
              languages = dict(common, layout="compact", langs_count="6", exclude_repo="samkrull")
              base = "https://github-stats-extended.vercel.app"
              return [base + "/api?" + urllib.parse.urlencode(stats),
                      base + "/api/top-langs/?" + urllib.parse.urlencode(languages)]
          
          
          def read_source(url):
              request = urllib.request.Request(url, headers={"User-Agent": "samkrull-profile/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if "image/svg+xml" not in response.headers.get("Content-Type", ""):
                      raise ValueError("The statistics service did not return SVG.")
                  source = response.read(1_000_001)
              if len(source) > 1_000_000:
                  raise ValueError("The statistics SVG is larger than expected.")
              return source
          
          
          def prepare_card(source, prefix, kind):
              root = ET.fromstring(source)
              if root.tag != tag("svg"):
                  raise ValueError("Expected an SVG document.")
              width, height = float(root.get("width", "0")), float(root.get("height", "0"))
              if not (200 <= width <= 1000 and 50 <= height <= 600):
                  raise ValueError("Unexpected statistics card dimensions.")
              all_text = " ".join(root.itertext())
              for element in root.iter():
                  local_tag = element.tag.rsplit("}", 1)[-1]
                  if local_tag in {"script", "foreignObject", "image"}:
                      raise ValueError("Unexpected active or external SVG content.")
                  for attribute, value in element.attrib.items():
                      local_attribute = attribute.rsplit("}", 1)[-1]
                      if local_attribute.lower().startswith("on"):
                          raise ValueError("Unexpected SVG event handler.")
                      if local_attribute == "href" and not value.startswith("#"):
                          raise ValueError("External SVG references are not supported.")
              if kind == "stats":
                  actual = {element.get("data-testid") for element in root.iter()
                            if element.tag == tag("text") and "".join(element.itertext()).strip()}
                  if not {"stars", "commits", "prs", "issues", "contribs"}.issubset(actual):
                      raise ValueError("Statistics are unavailable; previous valid image will be retained.")
              else:
                  has_languages = any("lang-name" in element.get("class", "").split()
                                      and "".join(element.itertext()).strip() for element in root.iter())
                  empty = "Sem dados de linguagens." in all_text or "No languages data." in all_text
                  if not (has_languages or empty):
                      raise ValueError("Languages are unavailable; previous valid image will be retained.")
          
              ids = {element.get("id"): prefix + element.get("id")
                     for element in root.iter() if element.get("id")}
              for element in root.iter():
                  for attribute, value in list(element.attrib.items()):
                      local_attribute = attribute.rsplit("}", 1)[-1]
                      if local_attribute == "id":
                          value = ids[value]
                      elif local_attribute == "class":
                          value = " ".join(prefix + item for item in value.split())
                      elif local_attribute in {"aria-labelledby", "aria-describedby"}:
                          value = " ".join(ids.get(item, item) for item in value.split())
                      for previous, current in ids.items():
                          value = value.replace("url(#" + previous + ")", "url(#" + current + ")")
                          if local_attribute == "href" and value == "#" + previous:
                              value = "#" + current
                      element.set(attribute, value)
          
                  if element.tag == tag("style") and element.text:
                      css = element.text
                      for previous, current in ids.items():
                          css = re.sub(r"#" + re.escape(previous) + r"(?![\w-])", "#" + current, css)
                      css = re.sub(r"\.([A-Za-z_][\w-]*)", lambda match: "." + prefix + match[1], css)
                      names = set(re.findall(r"@keyframes\s+([\w-]+)", css))
                      for name in names:
                          css = re.sub(r"\b" + re.escape(name) + r"\b", prefix + name, css)
                      css = css.replace("* {", "#" + prefix + "root * {")
                      css += "\n." + prefix + "stagger { opacity: 1 !important; }\n"
                      css += "#" + prefix + "root * { animation: none !important; }\n"
                      element.text = css
              root.set("id", prefix + "root")
              return root, width, height
          
          
          def build_panel(stats_source, languages_source):
              stats, stats_width, stats_height = prepare_card(stats_source, "stats_", "stats")
              languages, languages_width, languages_height = prepare_card(languages_source, "langs_", "languages")
              width = stats_width + languages_width
              content_height = max(stats_height, languages_height)
              height = content_height + 29
              root = ET.Element(tag("svg"), {"width": str(int(width)), "height": str(int(height)),
                  "viewBox": f"0 0 {width:g} {height:g}", "role": "img", "aria-labelledby": "panel-title"})
              ET.SubElement(root, tag("title"), {"id": "panel-title"}).text = "Estatísticas e linguagens públicas de Samuel Krull"
              defs = ET.SubElement(root, tag("defs"))
              clip = ET.SubElement(defs, tag("clipPath"), {"id": "panel-clip"})
              ET.SubElement(clip, tag("rect"), {"x": "0.5", "y": "0.5", "width": str(width - 1),
                  "height": str(height - 1), "rx": "10"})
              ET.SubElement(root, tag("rect"), {"x": "0.5", "y": "0.5", "width": str(width - 1),
                  "height": str(height - 1), "rx": "10", "fill": "#0D1117"})
              content = ET.SubElement(root, tag("g"), {"clip-path": "url(#panel-clip)"})
              stats.set("x", "0"); stats.set("y", "0")
              languages.set("x", f"{stats_width:g}"); languages.set("y", "0")
              content.extend([stats, languages])
              ET.SubElement(root, tag("line"), {"x1": f"{stats_width:g}", "x2": f"{stats_width:g}",
                  "y1": "18", "y2": f"{content_height - 14:g}", "stroke": "#263342"})
              date = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=3)).strftime("%d/%m/%Y")
              ET.SubElement(root, tag("text"), {"x": "25", "y": f"{height - 12:g}", "fill": "#8B949E",
                  "font-size": "11", "font-family": "Segoe UI, Arial, sans-serif"}).text = "Dados públicos · Consulta em " + date
              ET.SubElement(root, tag("rect"), {"x": "0.5", "y": "0.5", "width": str(width - 1),
                  "height": str(height - 1), "rx": "10", "fill": "none", "stroke": "#30363D"})
              return ET.tostring(root, encoding="unicode")
          
          
          HEADER = '''<svg xmlns="http://www.w3.org/2000/svg" width="990" height="220" viewBox="0 0 990 220" role="img" aria-labelledby="title description">
            <title id="title">Samuel Krull</title>
            <desc id="description">Cabeçalho azul com circuitos: programação, automação e inteligência artificial.</desc>
            <defs>
              <linearGradient id="background" x2="1" y2="0.3"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#102741"/></linearGradient>
              <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="40" y1="52" x2="40" y2="167"><stop stop-color="#388BFD"/><stop offset="1" stop-color="#79C0FF"/></linearGradient>
            </defs>
            <rect x="0.5" y="0.5" width="989" height="219" rx="12" fill="url(#background)" stroke="#25374E"/>
            <path d="M40 52V167" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
            <text x="62" y="67" fill="#79C0FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2">ESTUDANTE · TECNOLOGIA</text>
            <text x="60" y="122" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="650">Samuel Krull</text>
            <text x="62" y="160" fill="#B5C9E0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Programação · Automação · Inteligência artificial</text>
            <g fill="none" stroke="#58A6FF" stroke-width="1.5" opacity="0.47">
              <path d="M654 54H700L733 87H777M627 109H701L729 137H777M669 179H713L750 155H777"/>
              <path d="M843 87H887L922 52H963M843 110H936M843 140H898L928 170H963"/>
              <path d="M790 65V44H761M810 65V26H861M830 65V46H916M791 151V183H748M813 151V196H876M833 151V177H883"/>
            </g>
            <g fill="#79C0FF" opacity="0.8">
              <circle cx="654" cy="54" r="3"/><circle cx="627" cy="109" r="3"/><circle cx="669" cy="179" r="3"/>
              <circle cx="936" cy="110" r="3"/><circle cx="963" cy="52" r="3"/><circle cx="963" cy="170" r="3"/>
              <circle cx="761" cy="44" r="3"/><circle cx="861" cy="26" r="3"/><circle cx="916" cy="46" r="3"/>
              <circle cx="748" cy="183" r="3"/><circle cx="876" cy="196" r="3"/><circle cx="883" cy="177" r="3"/>
            </g>
            <rect x="777" y="65" width="68" height="86" rx="9" fill="#10253D" stroke="#4B8DCF"/>
            <rect x="785" y="73" width="52" height="70" rx="5" fill="#0D1C2E" stroke="#284665"/>
            <text x="811" y="117" text-anchor="middle" fill="#B9DDFF" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">IA</text>
          </svg>'''
          
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--sources", type=pathlib.Path)
              parser.add_argument("--output", type=pathlib.Path, default=pathlib.Path("dist"))
              args = parser.parse_args()
              args.output.mkdir(parents=True, exist_ok=True)
              (args.output / "profile-header.svg").write_text(HEADER, encoding="utf-8")
              try:
                  if args.sources:
                      sources = [(args.sources / name).read_bytes() for name in ["stats-source.svg", "languages-source.svg"]]
                  else:
                      sources = [read_source(url) for url in source_urls()]
                  panel = build_panel(*sources)
              except Exception as error:
                  if args.sources:
                      raise
                  print("::warning::Public statistics could not be refreshed: " + str(error))
                  previous_url = "https://api.github.com/repos/samkrull/samkrull/contents/github-panel.svg?ref=output"
                  try:
                      headers = {"User-Agent": "samkrull-profile/1.0", "Accept": "application/vnd.github+json"}
                      if os.environ.get("GITHUB_TOKEN"):
                          headers["Authorization"] = "Bearer " + os.environ["GITHUB_TOKEN"]
                      request = urllib.request.Request(previous_url, headers=headers)
                      with urllib.request.urlopen(request, timeout=15) as response:
                          metadata = json.load(response)
                      if metadata.get("encoding") != "base64" or metadata.get("size", 1_000_001) > 1_000_000:
                          raise ValueError("Unexpected previous panel metadata.")
                      previous = base64.b64decode(metadata["content"])
                      previous_root = ET.fromstring(previous)
                      if len(previous) > 1_000_000 or previous_root.tag != tag("svg"):
                          raise ValueError("Unexpected previous panel.")
                      has_statistics = any(element.get("data-testid") == "stars" for element in previous_root.iter())
                      placeholder = "Estatísticas temporariamente indisponíveis" in "".join(previous_root.itertext())
                      if not (has_statistics or placeholder):
                          raise ValueError("No previous valid statistics panel.")
                      panel = previous.decode("utf-8")
                      print("Retained previous panel and its original consultation date.")
                  except urllib.error.HTTPError as previous_error:
                      if previous_error.code != 404:
                          raise RuntimeError("The previous panel could not be checked; nothing will be published.") from previous_error
                      panel = '''<svg xmlns="http://www.w3.org/2000/svg" width="990" height="224" viewBox="0 0 990 224" role="img" aria-labelledby="title">
                        <title id="title">Estatísticas temporariamente indisponíveis</title>
                        <rect x=".5" y=".5" width="989" height="223" rx="10" fill="#0D1117" stroke="#30363D"/>
                        <text x="25" y="48" fill="#79C0FF" font-family="Segoe UI, Arial, sans-serif" font-size="20">Meu GitHub</text>
                        <text x="25" y="90" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="16">Dados temporariamente indisponíveis.</text>
                        <text x="25" y="122" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="14">A próxima atualização tentará consultar as estatísticas novamente.</text>
                      </svg>'''
                  except Exception as previous_error:
                      raise RuntimeError("The previous panel could not be checked; nothing will be published.") from previous_error
              (args.output / "github-panel.svg").write_text(panel, encoding="utf-8")
              print("Created header and unified panel.")
          
          
          if __name__ == "__main__":
              main()
          PY

      - name: Create light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: samkrull
          github_token: ${{ github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563EB&color_dots=%23ebedf0,%23bfdbfe,%2360a5fa,%232563eb,%231e40af
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2379C0FF&color_dots=%23161b22,%230c2d6b,%231f6feb,%2358a6ff,%2379c0ff

      - name: Confirm all profile images were created
        run: |
          test -s dist/profile-header.svg
          test -s dist/github-panel.svg
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Save profile images on the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: 'chore(profile): refresh profile images'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
